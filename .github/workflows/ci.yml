name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            qt6-base-dev \
            libqt6svg6-dev \
            libx11-dev \
            libxtst-dev \
            libpulse-dev

      - name: Configure
        run: cmake -S cpp -B build-cpp

      - name: Build
        run: cmake --build build-cpp -j "$(nproc)"
