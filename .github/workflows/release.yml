name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            qt6-base-dev \
            qt6-svg-dev \
            libx11-dev \
            libxtst-dev \
            imagemagick \
            file

      - name: Build portable bundle
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/build-portable-bundle.sh "${RELEASE_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/paxp2t-${{ github.ref_name }}-linux-x86_64-portable.tar.gz
          generate_release_notes: true
