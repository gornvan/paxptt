name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            qt6-base-dev \
            libx11-dev \
            libxtst-dev \
            imagemagick \
            file

      - name: Configure
        run: |
          cmake -S cpp -B build-cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DPAXP2T_RELEASE_MINIMAL=ON

      - name: Build
        run: cmake --build build-cpp -j "$(nproc)"

      - name: Strip binary
        run: strip --strip-unneeded build-cpp/paxp2t

      - name: Placeholder icon for linuxdeploy
        run: |
          mkdir -p packaging
          convert -size 128x128 xc:none \
            -fill '#44BB44' \
            -draw 'circle 64,64 64,10' \
            packaging/paxp2t.png

      - name: Fetch linuxdeploy (+ Qt plugin)
        run: |
          curl -fsSL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Bundle Qt and dependencies (portable AppDir)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          QMAKE="$(command -v qmake6 || command -v qmake)"
          if [[ -z "$QMAKE" ]]; then
            echo "qmake not found; qt6-base-dev may be broken on this image"
            exit 1
          fi
          export QMAKE
          echo "Using QMAKE=$QMAKE"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            -e build-cpp/paxp2t \
            -d packaging/paxp2t.desktop \
            -i packaging/paxp2t.png \
            --plugin qt

      - name: Strip bundled shared libraries
        run: |
          find AppDir -type f \( -name '*.so' -o -name '*.so.*' \) -print0 \
            | while IFS= read -r -d '' f; do
                strip --strip-unneeded "$f" 2>/dev/null || true
              done

      - name: Package portable tree
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mv AppDir "paxp2t-${TAG_NAME}-linux-x86_64-portable"
          tar -czvf "paxp2t-${TAG_NAME}-linux-x86_64-portable.tar.gz" \
            "paxp2t-${TAG_NAME}-linux-x86_64-portable"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: paxp2t-${{ github.ref_name }}-linux-x86_64-portable.tar.gz
          generate_release_notes: true
